name: Daily Macro Signal Refresh

on:
  schedule:
    # Runs every day at 8:30 AM IST (3:00 AM UTC)
    - cron: "0 3 * * *"
  workflow_dispatch: # Allow manual trigger from GitHub UI

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  refresh-dashboard:
    runs-on: ubuntu-latest
    name: Refresh 12 Macro Signals

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run macro signal agent
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'claude' }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node src/agent.js

      - name: Commit updated dashboard
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "Macro Dashboard Bot"
          git add data/latest.json data/history.json public/index.html
          git diff --staged --quiet || git commit -m "📊 Dashboard refresh: $(date +'%Y-%m-%d %H:%M IST')"
          git push

  deploy-pages:
    needs: refresh-dashboard
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./public"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
